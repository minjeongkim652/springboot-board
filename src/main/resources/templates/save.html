<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>save</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/board.css">
</head>
<body>
<div class="page">
    <header class="page-header">
        <h1 class="site-title">글쓰기</h1>
    </header>

    <form class="board-form" action="/board/save" method="post">
        <div class="field">
            <label for="boardWriter">작성자</label>
            <input type="text" id="boardWriter" name="boardWriter" required>
        </div>
        <div class="field">
            <label for="boardPass">비밀번호</label>
            <input type="password" id="boardPass" name="boardPass" required>
        </div>
        <div class="field">
            <label for="boardTitle">제목</label>
            <input type="text" id="boardTitle" name="boardTitle" required>
        </div>
        <div class="field">
            <label for="boardContents">내용</label>
            <textarea id="boardContents" name="boardContents" rows="10" required></textarea>
        </div>
        <div class="form-actions">
            <a class="btn btn-ghost" href="/board/">취소</a>
            <button type="submit" class="btn btn-primary">글작성</button>
        </div>
    </form>
</div>
</body>
</html>
