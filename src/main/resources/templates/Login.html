<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/board.css">
</head>
<body>
<div class="page">
  <header class="page-header">
    <h1 class="site-title">로그인</h1>
  </header>

  <div class="alert" th:if="${errorMessage}" th:text="${errorMessage}"></div>

  <form class="board-form" action="/member/login" method="post">
    <div class="field">
      <label for="memberId">아이디</label>
      <input type="text" id="memberId" name="memberId" required autofocus>
    </div>
    <div class="field">
      <label for="memberPass">비밀번호</label>
      <input type="password" id="memberPass" name="memberPass" required>
    </div>
    <div class="form-actions">
      <a class="btn btn-ghost" href="/member/join">회원가입</a>
      <button type="submit" class="btn btn-primary">로그인</button>
    </div>
  </form>
</div>
<script th:if="${errorMessage}">
  alert('[[${errorMessage}]]');
</script>
</body>
</html>
