<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>detail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/board.css}">
</head>
<body>
<div class="page">
    <header class="page-header">
        <h1 class="site-title">자유게시판</h1>
    </header>

    <h2 class="detail-title" th:text="${board.boardTitle}"></h2>
    <ul class="detail-sub">
        <li th:text="${board.boardWriter}"></li>
        <li th:text="${board.boardCreatedAt}"></li>
        <li th:text="'조회 ' + ${board.boardHits}"></li>
    </ul>
    <div class="detail-body">
        <p th:text="${board.boardContents}"></p>
    </div>
    <div class="detail-actions">
        <button class="btn btn-ghost" onclick="listReq()">목록</button>
        <button class="btn btn-primary" onclick="updateReq()">수정</button>
        <button class="btn btn-danger" onclick="deleteReq()">삭제</button>
    </div>
</div>
<script th:inline="javascript">
    const listReq = () => {
        console.log("상세조회 목록");
        location.href = "/board/";
    }
    const updateReq = () => {
        console.log("수정 요청");
        const id = [[${board.id}]];
        location.href = `/board/update/${id}`;
    }
    const deleteReq = () => {
        console.log("삭제 요청");
        const id = [[${board.id}]];
        location.href = `/board/delete/${id}`;
    }
</script>
</body>
</html>
