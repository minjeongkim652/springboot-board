<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>update</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/board.css}">
</head>
<body>
<div class="page">
    <header class="page-header">
        <h1 class="site-title">글수정</h1>
    </header>

    <div class="alert" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <form class="board-form" action="/board/update" method="post" name="updateForm">
        <input type="hidden" name="id" th:value="${board.id}">

        <div class="field">
            <label for="boardWriter">작성자</label>
            <input type="text" id="boardWriter" name="boardWriter" th:value="${board.boardWriter}" readonly>
        </div>
        <div class="field">
            <label for="updatePass">비밀번호 확인</label>
            <input type="password" id="updatePass" name="updatePass" required>
        </div>
        <input type="hidden" name="boardPass" th:value="${board.boardPass}">

        <div class="field">
            <label for="boardTitle">제목</label>
            <input type="text" id="boardTitle" name="boardTitle" th:value="${board.boardTitle}">
        </div>
        <div class="field">
            <label for="boardContents">내용</label>
            <textarea id="boardContents" name="boardContents" rows="10" th:text="${board.boardContents}"></textarea>
        </div>
        <input type="hidden" name="boardHits" th:value="${board.boardHits}">

        <div class="form-actions">
            <a class="btn btn-ghost" href="/board/">취소</a>
            <button type="submit" class="btn btn-primary">글수정</button>
        </div>
    </form>
</div>
<script th:if="${errorMessage}">
    alert('[[${errorMessage}]]');
</script>
</body>
</html>
